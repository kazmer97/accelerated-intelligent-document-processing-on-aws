[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idpcli"
version = "0.1.0"
description = "IDP CLI for SDLC operations"
authors = [
    {name = "Vincil Bishop", email = "vincilb@amazon.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "python-dotenv>=1.0.1,<2.0.0",
    "boto3>=1.37.1,<2.0.0",
    "typer>=0.15.1,<0.16.0",
    "loguru>=0.7.3,<0.8.0",
    "python-slugify>=8.0.4,<9.0.0",
    "pytest>=8.3.4,<9.0.0",
    "urllib3>=2.5.0,<3.0.0",
    "setuptools",
]

[project.scripts]
idpcli = "idpcli.cli.main:app"

# Hatchling configuration
[tool.hatch.build.targets.wheel]
packages = ["src/idpcli"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

# UV configuration
[tool.uv]
package = true

# Modern PEP 735 dependency groups
[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "tornado>=6.5,<7.0",
]
