[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idp_common"
version = "0.3.13"
description = "Common utilities for GenAI IDP Accelerator patterns"
authors = [{ name = "AWS", email = "noreply@amazon.com" }]
requires-python = ">=3.9,<3.14"
dependencies = [
  "boto3==1.39.7",      # Core dependency for AWS services
  "jsonschema>=4.25.1",
  "pydantic>=2.12.0",
]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

# Optional dependencies for each component
[project.optional-dependencies]
# Core utilities only - minimal dependencies
core = []

# Image handling dependencies
image = ["Pillow==11.2.1"]

# OCR module dependencies
ocr = [
  "Pillow==11.2.1",
  "PyMuPDF==1.25.5",
  "amazon-textract-textractor[pandas]==1.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
]

# Classification module dependencies
classification = [
  "Pillow==11.2.1", # For image handling
]

# Extraction module dependencies
extraction = [
  "Pillow==11.2.1",  # For image handling
  "deepdiff>=6.0.0",
]

# Assessment module dependencies
assessment = [
  "Pillow==11.2.1", # For image handling
]

# Evaluation module dependencies
evaluation = [
  "munkres>=1.1.4", # For Hungarian algorithm
  "numpy==1.26.4",  # For numeric operations
]

# Criteria validation module dependencies
criteria_validation = [
  "s3fs==2023.12.2", # For S3 file system operations
]

# Reporting module dependencies
reporting = [
  "pyarrow==20.0.0", # For Parquet conversion
]

# Appsync module dependencies
appsync = ["requests==2.32.4"]

# Agents module dependencies
agents = [
  "strands-agents>=1.0.0; python_version>='3.10'",
  "strands-agents-tools>=0.2.2; python_version>='3.10'",
  "bedrock-agentcore>=0.1.1; python_version>='3.10'",    # Specifically for the code interpreter tool
]

# Document service factory dependencies (includes both appsync and dynamodb support)
# This includes all dependencies needed for both backends
docs_service = [
  "requests==2.32.4",     # Required for appsync module (dynamodb only needs boto3 which is core)
  "aws-xray-sdk>=2.12.0", # Required for X-Ray tracing
]

# Full package with all dependencies - references all other extras
all = [
  "idp_common[core]",
  "idp_common[image]",
  "idp_common[ocr]",
  "idp_common[classification]",
  "idp_common[extraction]",
  "idp_common[assessment]",
  "idp_common[evaluation]",
  "idp_common[criteria_validation]",
  "idp_common[reporting]",
  "idp_common[appsync]",
  "idp_common[agents]",
  "idp_common[docs_service]",
  "idp_common[agentic-extraction]",
]
agentic-extraction = [
  "jsonpatch==1.33",
  "strands-agents>=1.7.1 ; python_full_version >= '3.10'",
  "pandas>=2.2.3",
  "pymupdf>=1.25.5",
  "email-validator>=2.3.0",
  "tabulate>=0.9.0",
  "aws-lambda-powertools>=3.2.0",                          # Structured logging and observability
  "datamodel-code-generator>=0.25.0",                      # Generate Pydantic models from JSON Schema
]

[project.urls]
Homepage = "https://github.com/aws-samples/accelerated-intelligent-document-processing-on-aws"

# Hatchling build configuration
[tool.hatch.build.targets.sdist]
include = ["/idp_common", "/tests", "/README.md"]

[tool.hatch.build.targets.wheel]
packages = ["idp_common"]

# UV configuration for this package
[tool.uv]
package = true

# Modern PEP 735 dependency groups
[dependency-groups]
# Development dependencies (testing + linting + dev tools)
# Use with: uv sync --all-extras --group dev
# This installs all optional features for comprehensive testing
dev = [
  # Testing
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.3.1",
  "pytest-mock>=3.11.0",
  "pytest-asyncio>=1.1.0",
  "moto[s3]>=5.1.8",
  # Linting
  "ruff>=0.14.0",
  # Development tools
  "python-dotenv>=1.1.0",
  # Notebook development
  "ipykernel>=6.29.5",
  "jupyter>=1.1.1",
]
